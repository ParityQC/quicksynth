name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # weekly, so that a change of the runner images or a Python release shows up
  # without a commit
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The dev container's uv, which wrote uv.lock. Dependabot rewrites uv.lock
  # with its own, newer uv; uv lock --check accepts a lock file of another
  # "revision" with the same "version" (the format, at the top of uv.lock).
  # Should a Dependabot pull request fail the check, raise this, and the uv of
  # wheels.yml and .devcontainer/Dockerfile, in that pull request.
  UV_VERSION: "0.12.17"
  # Each job syncs the environment once, explicitly; uv run must not sync it
  # again, which would install the package where a job leaves it out.
  UV_NO_SYNC: "1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      # ruff and mypy read the sources: the C++ core is not built
      - name: Install the dev tools
        run: uv sync --locked --no-install-project

      - name: ruff
        run: make lint

      - name: mypy
        run: make typecheck

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # clang-format and the file checks; make lint has run ruff
      - name: pre-commit
        run: SKIP=ruff-check,ruff-format uv run pre-commit run --all-files --show-diff-on-failure

      # actionlint also runs the runner's shellcheck on the run: scripts
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # every Python on Linux, the oldest and the newest elsewhere;
        # macos-latest is arm64, macos-15-intel x86_64. While the repository is
        # private, where macOS and Windows minutes are billed, only a manual run
        # adds them; a public repository runs them on pushes, pull requests and
        # manual runs. The weekly run is Linux only: a schedule event does not
        # carry the repository's visibility.
        os: >-
          ${{ fromJSON(github.event_name != 'workflow_dispatch'
            && (github.event.repository.private || github.event_name == 'schedule')
            && '["ubuntu-latest"]'
            || '["ubuntu-latest", "macos-latest", "macos-15-intel", "windows-latest"]') }}
        python: ["3.12", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    # Windows has not had a green run yet; remove this once it has.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}

      - name: Both test suites without the slow tests
        if: runner.os != 'Windows'
        run: |
          uv sync --all-extras --locked
          make test-fast

      # the editable install builds with Visual Studio's ClangCL toolset
      # (pyproject.toml)
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: uv sync --all-extras --locked

      # Visual Studio's ClangCL toolset; the Ninja target of make test-cpp would
      # need the Visual Studio environment set up first
      - name: C++ tests without the slow ones (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run cmake -S . -B build/tests -T ClangCL -DQUICKSYNTH_TESTS=ON
          uv run cmake --build build/tests --config Release --target quicksynth_tests
          uv run ctest --test-dir build/tests -C Release --output-on-failure -j 4 -LE slow

      - name: Python tests without the slow ones (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -m "not slow" -n auto

  full:
    name: Full tests and coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras --locked

      - name: Both test suites, slow tests included
        run: make test PYTEST_ARGS="-n auto --cov --cov-report=term"

      - name: Coverage summary
        run: |
          {
            echo "## Coverage of the Python package"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: C++ tests under ASan and UBSan
    # about half an hour: on pull requests only in a public repository
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      # CMake needs the interpreter and nanobind, not the Python package
      - name: Install the build tools
        run: uv sync --all-extras --locked --no-install-project

      - name: C++ tests without the slow ones
        run: make test-sanitizers
