version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv.lock only: the lower bounds in pyproject.toml are the package's promise
  # to its users and change by hand
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
