repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # kept byte for byte as it was written, with no final newline
        exclude: ^tests/fixtures/calibration_targets\.json$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # the dev container's clang-format (Debian bookworm's): other versions lay
  # the same .clang-format out differently
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.6
    hooks:
      - id: clang-format
        # C++ only: the hook's default types take in JSON, and so the fixtures
        types_or: [c++]
